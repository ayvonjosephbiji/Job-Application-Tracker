<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            border-bottom: 1px solid rgba(71, 85, 105, 0.5);
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 3rem 0;
        }

        .stat-card {
            padding: 1.5rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .stat-card:hover {
            transform: scale(1.05);
        }

        .stat-card.applied {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .stat-card.waiting {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }

        .stat-card.interview {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
        }

        .stat-card.offer {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .stat-card.rejected {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .stat-label {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-count {
            font-size: 2rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .btn-add {
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1e293b;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #334155;
            sticky: top 0;
            background-color: #1e293b;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        .modal-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-section h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-section:not(:first-child) {
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="url"],
        select,
        textarea {
            padding: 0.75rem 1rem;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #1e293b;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            border-top: 1px solid #334155;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #475569;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .applications-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .application-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }

        .application-card:hover {
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-title {
            flex: 1;
        }

        .card-title h3 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .card-title p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }

        .status-applied {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .status-waiting {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }

        .status-interview {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
        }

        .status-offer {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .status-rejected {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .card-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            color: #64748b;
            font-size: 0.875rem;
        }

        .detail-value {
            color: white;
            font-weight: 500;
        }

        .card-section {
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: rgba(71, 85, 105, 0.2);
            border-radius: 0.375rem;
            border: 1px solid #334155;
        }

        .card-section p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-icon {
            padding: 0.5rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-edit {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .btn-edit:hover {
            background-color: rgba(59, 130, 246, 0.4);
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state p {
            color: #94a3b8;
            font-size: 1.125rem;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .modal-content {
                max-width: calc(100vw - 2rem);
            }

            .header h1 {
                font-size: 2rem;
            }

            .card-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 1.5rem 1rem;
            }

            .container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Job Tracker</h1>
            <p>Track your applications, interviews, and opportunities</p>
        </div>
    </div>

    <div class="container">
        <!-- Stats Dashboard -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card applied" onclick="filterByStatus('Applied')">
                <div class="stat-label">Applied</div>
                <div class="stat-count" id="count-applied">0</div>
            </div>
            <div class="stat-card waiting" onclick="filterByStatus('Waiting')">
                <div class="stat-label">Waiting</div>
                <div class="stat-count" id="count-waiting">0</div>
            </div>
            <div class="stat-card interview" onclick="filterByStatus('Interview Scheduled')">
                <div class="stat-label">Interview Scheduled</div>
                <div class="stat-count" id="count-interview">0</div>
            </div>
            <div class="stat-card offer" onclick="filterByStatus('Offer')">
                <div class="stat-label">Offer</div>
                <div class="stat-count" id="count-offer">0</div>
            </div>
            <div class="stat-card rejected" onclick="filterByStatus('Rejected')">
                <div class="stat-label">Rejected</div>
                <div class="stat-count" id="count-rejected">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by job title or company..." onkeyup="filterApplications()">
            </div>
            <button class="btn-add" onclick="openAddForm()">+ Add Application</button>
        </div>

        <!-- Applications List -->
        <div class="applications-list" id="applicationsList">
            <div class="empty-state">
                <p>No applications yet. Start tracking!</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Application</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <!-- Core Information -->
                <div class="form-section">
                    <h3>Core Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="jobTitle" placeholder="Job Title">
                        </div>
                        <div class="form-group">
                            <input type="text" id="company" placeholder="Company Name">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="date" id="applicationDate">
                        </div>
                        <div class="form-group">
                            <input type="url" id="jobLink" placeholder="Job Posting Link">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <textarea id="jobDetails" placeholder="Full Job Details / Description"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="status">Application Status</label>
                        <select id="status">
                            <option value="Applied">Applied</option>
                            <option value="Waiting">Waiting</option>
                            <option value="Interview Scheduled">Interview Scheduled</option>
                            <option value="Offer">Offer</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                </div>

                <!-- Interview Details -->
                <div class="form-section">
                    <h3>Interview Details</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="date" id="interviewDate">
                        </div>
                        <div class="form-group">
                            <input type="time" id="interviewTime">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="interviewFormat">Interview Format</label>
                            <select id="interviewFormat">
                                <option value="N/A">N/A</option>
                                <option value="Phone">Phone</option>
                                <option value="Video">Video</option>
                                <option value="In-Person">In-Person</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <textarea id="interviewNotes" placeholder="Interview Notes"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Additional Info -->
                <div class="form-section">
                    <h3>Additional Info</h3>
                    <div class="form-row full">
                        <div class="form-group">
                            <textarea id="personalNotes" placeholder="Personal Notes (thoughts, talking points, company observations...)"></textarea>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <input type="date" id="followUpDate" placeholder="Follow-up Reminder Date">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" id="submitBtn" onclick="saveApplication()">Add Application</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let applications = [];
        let currentFilter = 'all';
        let editingId = null;

        // Load data from localStorage on page load
        function loadData() {
            const saved = localStorage.getItem('jobApplications');
            if (saved) {
                applications = JSON.parse(saved);
            }
            renderApplications();
            updateStats();
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('jobApplications', JSON.stringify(applications));
        }

        // Open add form
        function openAddForm() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Application';
            document.getElementById('submitBtn').textContent = 'Add Application';
            clearForm();
            document.getElementById('modal').classList.add('active');
        }

        // Open edit form
        function openEditForm(id) {
            const app = applications.find(a => a.id === id);
            if (!app) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Application';
            document.getElementById('submitBtn').textContent = 'Update Application';

            document.getElementById('jobTitle').value = app.jobTitle;
            document.getElementById('company').value = app.company;
            document.getElementById('applicationDate').value = app.applicationDate;
            document.getElementById('jobLink').value = app.jobLink;
            document.getElementById('jobDetails').value = app.jobDetails;
            document.getElementById('status').value = app.status;
            document.getElementById('interviewDate').value = app.interviewDate;
            document.getElementById('interviewTime').value = app.interviewTime;
            document.getElementById('interviewFormat').value = app.interviewFormat;
            document.getElementById('interviewNotes').value = app.interviewNotes;
            document.getElementById('personalNotes').value = app.personalNotes;
            document.getElementById('followUpDate').value = app.followUpDate;

            document.getElementById('modal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            clearForm();
            editingId = null;
        }

        // Clear form
        function clearForm() {
            document.getElementById('jobTitle').value = '';
            document.getElementById('company').value = '';
            document.getElementById('applicationDate').value = '';
            document.getElementById('jobLink').value = '';
            document.getElementById('jobDetails').value = '';
            document.getElementById('status').value = 'Applied';
            document.getElementById('interviewDate').value = '';
            document.getElementById('interviewTime').value = '';
            document.getElementById('interviewFormat').value = 'N/A';
            document.getElementById('interviewNotes').value = '';
            document.getElementById('personalNotes').value = '';
            document.getElementById('followUpDate').value = '';
        }

        // Save application
        function saveApplication() {
            const jobTitle = document.getElementById('jobTitle').value.trim();
            const company = document.getElementById('company').value.trim();

            if (!jobTitle || !company) {
                alert('Please fill in Job Title and Company Name');
                return;
            }

            const appData = {
                id: editingId || Date.now(),
                jobTitle,
                company,
                applicationDate: document.getElementById('applicationDate').value,
                jobLink: document.getElementById('jobLink').value,
                jobDetails: document.getElementById('jobDetails').value,
                status: document.getElementById('status').value,
                interviewDate: document.getElementById('interviewDate').value,
                interviewTime: document.getElementById('interviewTime').value,
                interviewFormat: document.getElementById('interviewFormat').value,
                interviewNotes: document.getElementById('interviewNotes').value,
                personalNotes: document.getElementById('personalNotes').value,
                followUpDate: document.getElementById('followUpDate').value,
            };

            if (editingId) {
                const index = applications.findIndex(a => a.id === editingId);
                applications[index] = appData;
            } else {
                applications.push(appData);
            }

            saveData();
            renderApplications();
            updateStats();
            closeModal();
        }

        // Delete application
        function deleteApplication(id) {
            if (confirm('Are you sure you want to delete this application?')) {
                applications = applications.filter(a => a.id !== id);
                saveData();
                renderApplications();
                updateStats();
            }
        }

        // Update stats
        function updateStats() {
            const statuses = ['Applied', 'Waiting', 'Interview Scheduled', 'Offer', 'Rejected'];
            const statusMap = {
                'Applied': 'applied',
                'Waiting': 'waiting',
                'Interview Scheduled': 'interview',
                'Offer': 'offer',
                'Rejected': 'rejected'
            };

            statuses.forEach(status => {
                const count = applications.filter(a => a.status === status).length;
                document.getElementById(`count-${statusMap[status]}`).textContent = count;
            });
        }

        // Filter by status
        function filterByStatus(status) {
            currentFilter = currentFilter === status ? 'all' : status;
            renderApplications();
        }

        // Filter applications
        function filterApplications() {
            renderApplications();
        }

        // Get filtered applications
        function getFilteredApplications() {
            let filtered = applications;

            // Status filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a.status === currentFilter);
            }

            // Search filter
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(a =>
                    a.jobTitle.toLowerCase().includes(search) ||
                    a.company.toLowerCase().includes(search)
                );
            }

            return filtered;
        }

        // Get status badge class
        function getStatusClass(status) {
            const map = {
                'Applied': 'status-applied',
                'Waiting': 'status-waiting',
                'Interview Scheduled': 'status-interview',
                'Offer': 'status-offer',
                'Rejected': 'status-rejected'
            };
            return map[status] || 'status-applied';
        }

        // Render applications
        function renderApplications() {
            const filtered = getFilteredApplications();
            const container = document.getElementById('applicationsList');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>${applications.length === 0 ? 'No applications yet. Start tracking!' : 'No matches found.'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(app => `
                <div class="application-card">
                    <div class="card-header">
                        <div class="card-title">
                            <h3>${escapeHtml(app.jobTitle)}</h3>
                            <p>${escapeHtml(app.company)}</p>
                        </div>
                        <div class="status-badge ${getStatusClass(app.status)}">
                            ${app.status}
                        </div>
                    </div>

                    <div class="card-details">
                        ${app.applicationDate ? `
                            <div class="detail-item">
                                <span class="detail-label">Applied</span>
                                <span class="detail-value">${app.applicationDate}</span>
                            </div>
                        ` : ''}
                        ${app.interviewDate ? `
                            <div class="detail-item">
                                <span class="detail-label">Interview</span>
                                <span class="detail-value">${app.interviewDate}${app.interviewTime ? ` at ${app.interviewTime}` : ''}</span>
                            </div>
                        ` : ''}
                        ${app.interviewFormat !== 'N/A' ? `
                            <div class="detail-item">
                                <span class="detail-label">Format</span>
                                <span class="detail-value">${app.interviewFormat}</span>
                            </div>
                        ` : ''}
                        ${app.followUpDate ? `
                            <div class="detail-item">
                                <span class="detail-label">Follow-up</span>
                                <span class="detail-value">${app.followUpDate}</span>
                            </div>
                        ` : ''}
                    </div>

                    ${app.jobDetails ? `
                        <div class="card-section">
                            <p><strong>Job Details:</strong></p>
                            <p>${escapeHtml(app.jobDetails)}</p>
                        </div>
                    ` : ''}

                    ${app.personalNotes ? `
                        <div class="card-section">
                            <p><strong>Notes:</strong></p>
                            <p>${escapeHtml(app.personalNotes)}</p>
                        </div>
                    ` : ''}

                    <div class="card-actions">
                        <button class="btn-icon btn-edit" onclick="openEditForm(${app.id})" title="Edit">✏️ Edit</button>
                        <button class="btn-icon btn-delete" onclick="deleteApplication(${app.id})" title="Delete">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML special characters
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize on page load
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
